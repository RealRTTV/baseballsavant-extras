<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>savant-extras config</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="../../assets/icon.svg"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="section-border">
        <svg class="section-border-loading-animation" preserveAspectRatio="none">
            <rect class="section-border-background-rect" x="0" y="0" width="100%" height="100%" fill="none" pathLength="100"/>
            <rect id="config-toml-loading-animation" class="section-border-loading-animation-rect" x="0" y="0" width="100%" height="100%" fill="none" stroke="#7DD3FC" pathLength="100" stroke-dasharray="15 85"/>
        </svg>
        <label for="config-textarea" class="section-header" style="font-family: 'Roboto Mono', monospace">config.toml</label>
        <span id="config-textarea-console"></span>
        <textarea id="config-textarea"></textarea>
    </div>
    <div class="section-border">
        <svg class="section-border-loading-animation" preserveAspectRatio="none">
            <rect class="section-border-background-rect" x="0" y="0" width="100%" height="100%" fill="none" pathLength="100"/>
            <rect id="custom-stats-loading-animation" class="section-border-loading-animation-rect" x="0" y="0" width="100%" height="100%" fill="none" stroke="#7DD3FC" pathLength="100" stroke-dasharray="15 85"/>
        </svg>
        <span class="section-header">Installed Custom Stats</span>
        <div id="custom-stats">
            <svg id="custom-stats-svg">
                <rect x="1" y="1" style="width: calc(100% - 2px); height: calc(100% - 2px)" rx="7" fill="none"
                      stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" stroke-dasharray="8 6"
                      stroke-linecap="round"/>
            </svg>
            <div id="custom-stats-entries">
                <div class="custom-stats-entry">
                    <span class="custom-stats-entry-name" title="dummy.js">dummy.js</span>
                    <div class="delete-button">&times;</div>
                </div>
            </div>
        </div>
    </div>
    <div class="section-border">
        <svg class="section-border-loading-animation" preserveAspectRatio="none">
            <rect class="section-border-background-rect" x="0" y="0" width="100%" height="100%" fill="none" pathLength="100"/>
            <rect id="cached-seasons-loading-animation" class="section-border-loading-animation-rect" x="0" y="0" width="100%" height="100%" fill="none" stroke="#7DD3FC" pathLength="100" stroke-dasharray="15 85"/>
        </svg>
        <span class="section-header">Cached Seasons</span>
        <div id="cached-seasons">

        </div>
    </div>
</body>
<script type="module" src="./main.ts"></script>
</html>
