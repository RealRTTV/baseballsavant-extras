<!doctype html>
<html lang="en">
<head>
    <link rel="stylesheet" type="text/css" href="style.css"/>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Default Popup Title</title>
    <meta name="manifest.type" content="browser_action"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
<div id="table">
    <div class="table-column">
        <div class="table-column-title">Available</div>
        <div class="pct-rankings">
            <svg class="pct-group-title">
                <rect fill="#399098" width="100%" height="2px" y="34"/>
                <image href="https://baseballsavant.mlb.com/sections/player-update/images/sliders/slider-trophy.png"
                       height="40" width="40"/>
                <text font-size="16" x="40" y="28" font-weight="bold">Value</text>
            </svg>
            <div class="pct-metrics">
                <svg class="pct-metric">
                    <g transform="translate(85, 0)">
                        <rect style="width: calc(100% - 85px - 35px)" height="5" fill="#c7dcdc" y="7.5"/>
                        <rect style="width: calc(0.96 * (100% - 85px - 35px - 12px) + 12px)" height="20" fill="rgb(216, 33, 41)" y="0"/>
                        <rect width="2" height="20" opacity="0.3" style="x: calc(12px - 1px)" fill="#fff"/>
                        <rect width="2" height="20" opacity="0.3" style="x: calc(0.5 * (100% - 85px - 35px) - 1px)" fill="#fff"/>
                        <rect width="2" height="20" opacity="0.3" style="x: calc((100% - 85px - 35px) - 12px - 1px)" fill="#fff"/>
                    </g>
                    <text dominant-baseline="middle" text-anchor="end" x="80" y="10" font-size="12" fill="#666">Batting Run Value</text>
                    <text dominant-baseline="middle" text-anchor="end" x="100%" y="10" font-size="12" fill="#666">28</text>
                    <g style="transform: translate(calc(85px + 0.96 * (100% - 85px - 35px - 12px) + 12px), 10px)">
                        <circle r="10" fill="rgb(216, 33, 41)" stroke="#fff" stroke-width="2"/>
                        <text dominant-baseline="middle" text-anchor="middle" fill="#fff" y="1" font-size="12" font-weight="bold">96</text>
                    </g>
                    <path d="M80,-1.5L0,-1.5" stroke="rgb(57, 144, 152)" stroke-width="1" stroke-dasharray="6 3" opacity="1"/>
                    <path d="M0,-1.5L30,-1.5" stroke="rgb(57, 144, 152)" stroke-width="1" stroke-dasharray="6 3" opacity="1" style="transform: translate(calc(100% - 30px), 0)"/>
                </svg>
            </div>
        </div>
    </div>
    <div class="table-column">
    </div>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
