<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>baseballsavant-extras</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div style="display: flex; flex-direction: row; gap: 8px">
    <div style="width: 240px; flex: none; border: 1px solid var(--ink-black); padding: 8px; border-radius: 8px">
        <span style="display: block; text-align: center; margin: 0 0 0.5rem 0">Config</span>
        <hr style="height: 1px; border: 0; background-color: var(--ink-black); width: 100%"/>
        <label for="config-textarea" style="display: block; text-align: center; margin: 0 0 0.5rem 0; font-size: 14px">Config TOML</label>
        <span id="config-textarea-console" style="display: block; margin: 0.5rem 0; color: var(--error-red); font-family: 'Roboto Mono', monospace; font-size: 12px"></span>
        <textarea id="config-textarea" style="font-size: 11px; resize: vertical; margin: 0 0 0.5rem 0; width: 100%; box-sizing: border-box; min-height: 100px; max-height: 200px; outline: none"></textarea>
        <span style="display: block; text-align: center; margin: 0 0 0.5rem 0; font-size: 14px">Custom Stats (drag-n-drop)</span>
        <div id="drop-zone" style="min-height: calc(24px * 5 + 8px * 2 + 8px * 4)">
            <svg id="drop-zone-svg" width="100%" height="100%">
                <defs>
                    <pattern id="stripes" width="10" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                        <line x1="0" y1="0" x2="0" y2="15" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" stroke-dasharray="0 15" stroke-linecap="round"/>
                    </pattern>

                    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="10" />
                    </filter>

                    <mask id="fade">
                        <rect x="10" y="10" style="width: calc(100% - 20px); height: calc(100% - 20px)" rx="12" fill="white" filter="url(#soften)"/>
                    </mask>
                </defs>

                <rect x="0" y="0" width="100%" height="100%" rx="4" fill="url(#stripes)" mask="url(#fade)"/>
                <rect x="1" y="1" style="width: calc(100% - 2px); height: calc(100% - 2px)" rx="7" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" stroke-dasharray="8 6" stroke-linecap="round"/>
            </svg>
            <div style="display: flex; flex-direction: column; gap: 8px; padding: 8px">
                <div style="min-height: 24px; box-sizing: content-box; background-color: var(--off-white); border-radius: 4px; border: 1px solid var(--light-gray); display: flex; align-items: center; padding: 0 5px">
                    <span style="font-size: 12px; font-family: 'Roboto Mono', monospace; max-width: calc(100% - 20px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">first-pitch-strike.js</span>
                    <div class="delete-button">&times;</div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<script type="module" src="./main.ts"></script>
</html>
