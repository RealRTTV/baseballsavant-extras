<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>baseballsavant-extras</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <span class="section-header" style="font-size: 20px">Config</span>
    <hr class="divider-line"/>
    <div>
        <label for="config-textarea" class="section-header" style="font-family: 'Roboto Mono', monospace">config.toml</label>
        <span id="config-textarea-console"></span>
        <textarea id="config-textarea"></textarea>
    </div>
    <hr class="divider-line"/>
    <div>
        <span class="section-header">Custom Stats (drag-n-drop)</span>
        <div id="custom-stats">
            <svg id="custom-stats-svg">
                <defs>
                    <pattern id="stripes" width="10" height="15" patternUnits="userSpaceOnUse"
                             patternTransform="rotate(45)">
                        <line x1="0" y1="0" x2="0" y2="15" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"
                              stroke-dasharray="0 15" stroke-linecap="round"/>
                    </pattern>

                    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="10"/>
                    </filter>

                    <mask id="fade">
                        <rect x="10" y="10" style="width: calc(100% - 20px); height: calc(100% - 20px)" rx="12"
                              fill="white" filter="url(#soften)"/>
                    </mask>
                </defs>

                <rect x="0" y="0" width="100%" height="100%" rx="4" fill="url(#stripes)" mask="url(#fade)"/>
                <rect x="1" y="1" style="width: calc(100% - 2px); height: calc(100% - 2px)" rx="7" fill="none"
                      stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" stroke-dasharray="8 6"
                      stroke-linecap="round"/>
            </svg>
            <div id="custom-stats-entries">
                <div class="custom-stats-entry">
                    <span class="custom-stats-entry-name" title="first-pitch-strike.js">first-pitch-strike.js</span>
                    <div class="delete-button">&times;</div>
                </div>
            </div>
        </div>
    </div>
    <hr class="divider-line"/>
    <div>
        <span class="section-header">Calculated Years</span>
        <div id="calculated-years">
            <div class="calculated-year">
                <span class="calculated-year-year">2026</span>
                <span class="calculated-year-file-size">1.2 GB</span>
                <span class="calculated-year-purge">Purge</span>
            </div>
        </div>
    </div>
</body>
<script type="module" src="./main.ts"></script>
</html>
