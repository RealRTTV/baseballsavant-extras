<!doctype html>
<html lang="en">
<head>
    <link rel="stylesheet" type="text/css" href="style.css"/>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Default Popup Title</title>
    <meta name="manifest.type" content="browser_action"/>
</head>
<body>
<div id="table">
    <div class="table-column">
        <h1>Available</h1>
        <div>
            <div class="stat-category-header">
                <img src="https://baseballsavant.mlb.com/sections/player-update/images/sliders/slider-trophy.png"
                     height="40" width="40" alt="Trophy">
                <h2>Value</h2>
            </div>
            <hr class="stat-category-line">
        </div>
        <div>
            <div class="stat-category-header">
                <img src="https://baseballsavant.mlb.com/sections/player-update/images/sliders/slider-batter.png"
                     height="40" width="40" alt="Batter">
                <h2>Batting</h2>
            </div>
            <hr class="stat-category-line">
        </div>
        <div>
            <div class="stat-category-header">
                <img src="https://baseballsavant.mlb.com/sections/player-update/images/sliders/slider-fielder.png"
                     height="40" width="40" alt="Fielder">
                <h2>Fielding</h2>
            </div>
            <hr class="stat-category-line">
        </div>
        <div>
            <div class="stat-category-header">
                <img src="https://baseballsavant.mlb.com/sections/player-update/images/sliders/slider-runner.png"
                     height="40" width="40" alt="Runner">
                <h2>Running</h2>
            </div>
            <hr class="stat-category-line">
        </div>
        <div>
            <div class="stat-category-header">
                <img src="https://baseballsavant.mlb.com/sections/player-update/images/sliders/slider-pitcher.png"
                     height="40" width="40" alt="Pitcher">
                <h2>Pitching</h2>
            </div>
            <hr class="stat-category-line">
        </div>
        <div>
            <div class="stat-category-header">
                <img src="https://baseballsavant.mlb.com/sections/player-update/images/sliders/slider-catcher.png"
                     height="40" width="40" alt="Catcher">
                <h2>Catching</h2>
            </div>
            <hr class="stat-category-line">
        </div>
    </div>
    <div class="table-column">
        <h1>Selected</h1>
    </div>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
